apiVersion: v1
kind: Pod
metadata:
  name: pod-client-true
  namespace: default
  labels:
    xds.semaphore.uw.systems/client: "true"
spec:
  initContainers:
    - name: init-test
      image: test
  containers:
    - name: my-app
      image: my-app:latest
    - name: my-app-2
      image: my-app-2:latest
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-exclude
  namespace: default
  labels:
    xds.semaphore.uw.systems/client: "exclude"
spec:
  containers:
    - name: my-app
      image: my-app:latest
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-envoy-sidecar
  namespace: default
  labels:
    xds.semaphore.uw.systems/client: "envoy-sidecar"
spec:
  initContainers:
    - name: original-init
      image: test
  containers:
    - name: my-app
      image: my-app:latest
    - name: my-app-2
      image: my-app-2:latest
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-ns-client
  namespace: ns-with-mutate-label
spec:
  containers:
    - name: my-app
      image: my-app:latest
---
# The API server names these pods after mutating admission has run, so the
# node id is only complete once the kubelet expands $(POD_NAME).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-client-true
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deployment-client-true
  template:
    metadata:
      labels:
        app: deployment-client-true
        xds.semaphore.uw.systems/client: "true"
    spec:
      containers:
        - name: my-app
          image: alpine:3.22
          command: ["sleep", "infinity"]
