apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: test-semaphore-xds-policies
spec:
  steps:
    - name: setup-prerequisites
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: ns-with-mutate-label
                labels:
                  xds.semaphore.uw.systems/mutate: bootstrap-client-config

        # A cluster kept by REUSE_CLUSTER still holds the pods from the previous
        # run, and applying over an existing Pod is rejected by the API server
        # (only image and a few other fields may change). Start clean so the
        # suite can run twice against the same cluster.
        - script:
            # Deleting the deployment waits for its pod's grace period, which
            # can take longer than the default script timeout.
            timeout: 120s
            content: |
              set -eu
              kubectl -n default delete deployment deployment-client-true --ignore-not-found --timeout=60s
              kubectl -n default delete pods -l xds.semaphore.uw.systems/client --ignore-not-found --timeout=60s
              # pod-ns-client is matched by the namespace label, not a pod label.
              kubectl -n ns-with-mutate-label delete pods --all --ignore-not-found --timeout=60s

    - name: apply-policies-and-exceptions
      try:
        - apply:
            file: ../mutate-semaphore-xds-clients-env.yaml
        - apply:
            file: ../mutate-semaphore-xds-envoy-sidecar.yaml

        - assert:
            timeout: 120s
            resource:
              apiVersion: policies.kyverno.io/v1
              kind: MutatingPolicy
              metadata:
                name: mutate-semaphore-xds-bootstrap-config
              status:
                generated: true
                conditionStatus:
                  (conditions[?type == 'RBACPermissionsGranted']):
                    - message: Policy is ready for reporting.
                      reason: Succeeded
                      status: "True"

        - assert:
            timeout: 120s
            resource:
              apiVersion: admissionregistration.k8s.io/v1
              kind: MutatingAdmissionPolicy
              metadata:
                name: mpol-mutate-semaphore-xds-bootstrap-config
              spec:
                reinvocationPolicy: Never
                (mutations[0].patchType): JSONPatch

        - assert:
            timeout: 120s
            resource:
              apiVersion: admissionregistration.k8s.io/v1
              kind: MutatingAdmissionPolicyBinding
              metadata:
                name: mpol-mutate-semaphore-xds-bootstrap-config-binding
              spec:
                policyName: mpol-mutate-semaphore-xds-bootstrap-config

        - assert:
            timeout: 120s
            resource:
              apiVersion: policies.kyverno.io/v1
              kind: MutatingPolicy
              metadata:
                name: mutate-semaphore-xds-envoy-sidecar
              status:
                generated: true
                conditionStatus:
                  (conditions[?type == 'RBACPermissionsGranted']):
                    - message: Policy is ready for reporting.
                      reason: Succeeded
                      status: "True"

        - assert:
            timeout: 120s
            resource:
              apiVersion: admissionregistration.k8s.io/v1
              kind: MutatingAdmissionPolicy
              metadata:
                name: mpol-mutate-semaphore-xds-envoy-sidecar
              spec:
                reinvocationPolicy: Never
                (mutations[0].patchType): ApplyConfiguration
                (mutations[1].patchType): JSONPatch

        - assert:
            timeout: 120s
            resource:
              apiVersion: admissionregistration.k8s.io/v1
              kind: MutatingAdmissionPolicyBinding
              metadata:
                name: mpol-mutate-semaphore-xds-envoy-sidecar-binding
              spec:
                policyName: mpol-mutate-semaphore-xds-envoy-sidecar

        # A policy backed by a MutatingAdmissionPolicy must not also run as a webhook.
        - assert:
            timeout: 120s
            resource:
              apiVersion: admissionregistration.k8s.io/v1
              kind: MutatingWebhookConfiguration
              metadata:
                name: kyverno-resource-mutating-webhook-cfg
              (length((webhooks || `[]`)[?contains(name, 'mutate-semaphore-xds-bootstrap-config')])): 0
              (length((webhooks || `[]`)[?contains(name, 'mutate-semaphore-xds-envoy-sidecar')])): 0

    # The API server applies a generated policy asynchronously, so wait until a
    # throwaway pod is actually mutated before creating the fixtures.
    - name: wait-for-generated-policy
      try:
        - script:
            timeout: 120s
            content: |
              set -eu

              # A pod is only mutated when it is created, so a pod created
              # before the API server loaded the generated policy stays
              # unmutated forever. Create a fresh canary per policy on every
              # attempt and wait until both policies are live.
              mutated_bootstrap=""
              mutated_envoy=""
              i=0
              while [ "$i" -lt 30 ]; do
                bootstrap="policy-canary-$i"
                envoy="envoy-canary-$i"
                kubectl -n default run "$bootstrap" --image=busybox --restart=Never --labels xds.semaphore.uw.systems/client=true >/dev/null 2>&1 || true
                kubectl -n default run "$envoy" --image=busybox --restart=Never --labels xds.semaphore.uw.systems/client=envoy-sidecar >/dev/null 2>&1 || true
                mutated_bootstrap=$(kubectl -n default get pod "$bootstrap" -o jsonpath='{.spec.containers[0].env[?(@.name=="POD_NAME")].name}' 2>/dev/null || true)
                mutated_envoy=$(kubectl -n default get pod "$envoy" -o jsonpath='{.spec.initContainers[?(@.name=="envoy-sidecar")].name}' 2>/dev/null || true)
                kubectl -n default delete pod "$bootstrap" "$envoy" --ignore-not-found --wait=false >/dev/null 2>&1 || true
                if [ -n "$mutated_bootstrap" ] && [ -n "$mutated_envoy" ]; then
                  break
                fi
                sleep 1
                i=$((i + 1))
              done

              if [ -z "$mutated_bootstrap" ] || [ -z "$mutated_envoy" ]; then
                echo "a generated policy did not mutate a canary pod (bootstrap='$mutated_bootstrap' envoy='$mutated_envoy')" >&2
                exit 1
              fi

    - name: deploy-test-resources
      try:
        - apply:
            file: resources.yaml

    - name: assert-mutate-semaphore-xds-bootstrap-config
      try:
        - assert:
            timeout: 30s
            file: patched-pod-client-true.yaml

        - assert:
            timeout: 30s
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: pod-exclude
                namespace: default
                labels:
                  xds.semaphore.uw.systems/client: "exclude"
              spec:
                containers:
                  - name: my-app
                    image: my-app:latest
                    (env == null): true

    - name: assert-generated-name-pod
      try:
        - script:
            timeout: 120s
            content: |
              set -eu

              # The deployment creates its pod asynchronously; wait for it to
              # be running before reading the container environment.
              pod=""
              i=0
              while [ "$i" -lt 30 ]; do
                pod=$(kubectl get pods -n default -l app=deployment-client-true -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                if [ -n "$pod" ]; then
                  kubectl wait -n default --for=condition=Ready "pod/$pod" --timeout=10s >/dev/null 2>&1 && break
                fi
                sleep 1
                i=$((i + 1))
              done
              if [ -z "$pod" ]; then
                echo "the deployment pod did not become ready" >&2
                exit 1
              fi

              # The container is running, so the kubelet has expanded
              # $(POD_NAME) in the injected config. Read the value the
              # application would actually get.
              value=$(kubectl exec -n default "$pod" -- printenv GRPC_XDS_BOOTSTRAP_CONFIG)

              if ! printf '%s' "$value" | grep -Fq "\"id\":\"default/$pod\""; then
                echo "node id is not default/$pod: $value" >&2
                exit 1
              fi

    - name: mutate-semaphore-xds-envoy-sidecar
      try:
        - assert:
            timeout: 30s
            file: patched-pod-envoy-sidecar.yaml
