apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: mutate-semaphore-xds-envoy-sidecar
  annotations:
    policies.kyverno.io/title: Mutate Sempaphore-xDS Envoy Sidecar
    policies.kyverno.io/category: xDS
    policies.kyverno.io/description: 'This policy ensures that pods labelled with xds.semaphore.uw.systems/envoy-sidecar: "true" are injected with an envoy sidecar to proxy grpc connections. It also points the rest of the containers to semaphore-xds-localhost sys-semaphore service to get mock xDS config that will point to a local port for envoy sidecar via gRPC bootstrap conifg.'
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  autogen:
    mutatingAdmissionPolicy:
      enabled: true
    podControllers:
      controllers: [] # disable autogen for other resources

  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]

  matchConditions:
    - name: match-envoy-sidecar
      expression: >-
        object.metadata.?labels['xds.semaphore.uw.systems/client'].orValue('') == 'envoy-sidecar'

    # Kyverno may invoke a mutating webhook more than once for the same pod
    # (reinvocationPolicy: IfNeeded). The patches below append the sidecar and
    # its volume, so the policy must not match once the sidecar is there.
    - name: match-no-envoy-sidecar
      expression: >-
        !object.spec.?initContainers.orValue([]).exists(c, c.?name.orValue('') == 'envoy-sidecar')

  variables:
    - name: pod_namespace
      expression: "request.namespace"

    - name: bootstrap_config
      expression: |
        '''{
          "xds_servers": [{
            "server_uri": "semaphore-xds-localhost.sys-semaphore.svc.cluster.local:18000",
            "channel_creds": [{"type": "insecure"}],
            "server_features": ["xds_v3"]}
          ],
          "node":{
            "id":"''' + variables.pod_namespace + '''/$(POD_NAME)",
            "locality":{}
          }
        }'''

    - name: injected_envs
      expression: |
        [
          {"name": dyn("POD_NAME"), "valueFrom": dyn({"fieldRef": {"fieldPath": "metadata.name"}})},
          {"name": dyn("GRPC_XDS_BOOTSTRAP_CONFIG"), "value": dyn(variables.bootstrap_config)}
        ]

    - name: envoy_startup_script
      expression: |
        '''echo '
        admin:
          address:
            socket_address: { address: 127.0.0.1, port_value: 9901 }
        static_resources:
          listeners:
          - name: listener_0
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 18001
            filter_chains:
              - filters:
                  - name: envoy.filters.network.http_connection_manager
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                      stat_prefix: ingress_http
                      codec_type: AUTO
                      rds:
                        route_config_name: kube_dynamic
                        config_source:
                          resource_api_version: V3
                          api_config_source:
                            api_type: DELTA_GRPC
                            transport_api_version: V3
                            grpc_services:
                            - envoy_grpc:
                                cluster_name: xds_cluster
                      http_filters:
                        - name: envoy.filters.http.on_demand
                          typed_config:
                            "@type": type.googleapis.com/envoy.extensions.filters.http.on_demand.v3.OnDemand
                        - name: envoy.filters.http.router
                          typed_config:
                            "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          - name: listener_admin
            address:
              socket_address:
                address: 0.0.0.0
                port_value: 9902
            filter_chains:
              - filters:
                  - name: envoy.filters.network.http_connection_manager
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                      stat_prefix: ingress_http
                      route_config:
                        name: local_route
                        virtual_hosts:
                            name: local_service
                            domains:
                              - "*"
                            routes:
                              - match:
                                  prefix: "/metrics"
                                route:
                                    cluster: envoy_admin
                                    prefix_rewrite: "/stats/prometheus"
                              - match:
                                  prefix: "/ready"
                                route:
                                    cluster: envoy_admin
                      http_filters:
                        - name: envoy.filters.http.router
                          typed_config:
                            "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          clusters:
          - name: xds_cluster
            connect_timeout: 0.25s
            type: STRICT_DNS
            lb_policy: ROUND_ROBIN
            typed_extension_protocol_options:
              envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
                "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
                explicit_http_config:
                  http2_protocol_options:
                    connection_keepalive:
                      interval: 30s
                      timeout: 5s
            upstream_connection_options:
              # configure a TCP keep-alive to detect and reconnect to the admin
              # server in the event of a TCP socket half open connection
              tcp_keepalive: {}
            load_assignment:
              cluster_name: xds_cluster
              endpoints:
              - lb_endpoints:
                - endpoint:
                    address:
                      socket_address:
                        address: semaphore-xds.sys-semaphore.svc.cluster.local
                        port_value: 18000
          - name: envoy_admin
            connect_timeout: 0.25s
            type: STATIC
            load_assignment:
              cluster_name: envoy_admin
              endpoints:
              - lb_endpoints:
                - endpoint:
                    address:
                      socket_address:
                        address: 127.0.0.1
                        port_value: 9901
        ' > /etc/envoy/config.yaml
        envoy -c /etc/envoy/config.yaml --service-node ''' + variables.pod_namespace + '''/${POD_NAME} --service-cluster ''' + variables.pod_namespace + '''/${POD_NAME}
        '''

  mutations:
    # The sidecar is added in two steps because the API server refuses to create
    # command and env[].valueFrom through an ApplyConfiguration (they are atomic),
    # while JSONPatch cannot express the typed container without dyn() noise.
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{spec: Object.spec{
            volumes: [Object.spec.volumes{
              name: "envoy-config",
              emptyDir: Object.spec.volumes.emptyDir{}
            }],
            initContainers: [Object.spec.initContainers{
              name: "envoy-sidecar",
              image: "envoyproxy/envoy:v1.33.0",
              imagePullPolicy: "Always",
              restartPolicy: "Always",
              startupProbe: Object.spec.initContainers.startupProbe{
                httpGet: Object.spec.initContainers.startupProbe.httpGet{
                  path: "/ready",
                  port: 9902
                },
                failureThreshold: 10,
                periodSeconds: 1
              },
              volumeMounts: [Object.spec.initContainers.volumeMounts{
                mountPath: "/etc/envoy",
                name: "envoy-config"
              }]
            }]
          }}

    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          object.spec.?initContainers.orValue([])
            .filter(c, c.?name.orValue('') == "envoy-sidecar")
            .map(c, object.spec.?initContainers.orValue([]).indexOf(c))
            .map(idx, [
              JSONPatch{
                op: "add",
                path: "/spec/initContainers/" + string(idx) + "/command",
                value: ["/bin/sh", "-c", variables.envoy_startup_script]
              },
              JSONPatch{
                op: "add",
                path: "/spec/initContainers/" + string(idx) + "/env",
                value: [{"name": dyn("POD_NAME"), "valueFrom": dyn({"fieldRef": {"fieldPath": "metadata.name"}})}]
              }
            ])
            .flatten() +
          object.spec.containers.map(c, object.spec.containers.indexOf(c)).map(idx,
            JSONPatch{
              op: "add",
              path: "/spec/containers/" + string(idx) + "/env",
              value: object.spec.containers[idx].?env.orValue([]) + variables.injected_envs
            }
          )
